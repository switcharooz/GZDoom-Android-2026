name: Build Doom APK (GZDoom Mods For Free Edition)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Force clean native build (ignore cache)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    name: Build native + APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install NDK 27.0.12077973
        run: |
          yes | sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_PATH

      - name: Verify NDK
        run: |
          echo "NDK at: $ANDROID_NDK_HOME"
          ls -la "$ANDROID_NDK_HOME" | head -20
          "$ANDROID_NDK_HOME/ndk-build" --version || true

      - name: Show hardcoded Java home (debug)
        run: |
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || echo "(no root gradle.properties)"
          echo "=== doom/gradle.properties ==="
          cat doom/gradle.properties 2>/dev/null || echo "(no doom/gradle.properties)"
          echo "=== local.properties ==="
          cat local.properties 2>/dev/null || echo "(no local.properties)"
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"

      - name: Strip hardcoded Java home from all properties files
        run: |
          find . -name "gradle.properties" -not -path "*/node_modules/*" -exec sed -i '/org.gradle.java.home/d' {} \; 2>/dev/null || true
          find . -name "local.properties" -exec sed -i '/org.gradle.java.home/d' {} \; 2>/dev/null || true
          echo "Stripped. Verifying:"
          grep -r "org.gradle.java.home" . 2>/dev/null || echo "✅ No hardcoded Java home remains"

      - name: Clean native build artifacts
        run: |
          echo "Wiping any pre-existing .so / obj dirs so this is a TRUE source build"
          rm -rf doom/src/main/libs/* 2>/dev/null || true
          rm -rf doom/src/main/obj/* 2>/dev/null || true
          ls -la doom/src/main/libs 2>/dev/null || echo "(libs dir gone or empty)"
          ls -la doom/src/main/obj 2>/dev/null || echo "(obj dir gone or empty)"

      - name: Cache Gradle (wrapper + caches only, NOT native)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make build scripts executable
        run: |
          chmod +x ./build_native.sh || true
          chmod +x ./gradlew || true

      - name: Build native engine (.so) with NDK — FROM SOURCE
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          echo "=========================================="
          echo "STARTING FRESH NATIVE BUILD FROM SOURCE"
          echo "No cache. No shortcuts. Pure .cpp grind."
          echo "=========================================="
          ./build_native.sh

      - name: Verify .so exists
        run: |
          echo "=== Built native libs ==="
          find doom/src/main/libs -name "*.so" -type f -exec ls -la {} \; || echo "⚠️ No .so found!"
          find . -name "libzdoom.so" -o -name "libdoom.so" -o -name "*.so" -path "*/libs/*" 2>/dev/null | head -20

      - name: Build APK (debug)
        run: |
          ./gradlew :doom:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.java.home=$JAVA_HOME

      - name: Build APK (release, unsigned)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew :doom:assembleRelease --stacktrace --no-daemon \
            -Dorg.gradle.java.home=$JAVA_HOME
        continue-on-error: true

      - name: Locate APKs
        id: find_apks
        run: |
          echo "APKs found:"
          find . -name "*.apk" -type f -print
          mkdir -p artifacts
          find . -name "*.apk" -type f -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doom-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload native libs (debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ github.sha }}
          path: doom/src/main/libs/**
          if-no-files-found: ignore
          retention-days: 7
